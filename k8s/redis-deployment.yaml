apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-redis
  namespace: chaos-sandbox
  labels:
    app: chaos-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-redis
  template:
    metadata:
      labels:
        app: chaos-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 20